name: Inscrições diárias

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 06:00 BRT, todos os dias
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar notícias e injetar no noticias.html
        run: node scripts/update-news.mjs
        env:
          APITUBE_KEY: ${{ secrets.APITUBE_KEY }}

      - name: Commit e push (dispara a Vercel)
        run: |
          git config user.name "gena-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.html
          if git diff --cached --quiet; then
            echo "Nada novo nas terras. Sem deploy."
          else
            git commit -m "notícias: inscrições diárias do abismo"
            git push
          fi
